name: Release

# Tag-triggered Windows release of the league-link C ABI component.
#
# Flow: build league_link.dll on a GitHub-hosted Windows runner -> upload it as
# a workflow artifact -> (if SignPath is configured) submit it for signing and
# wait for a human approver -> publish a GitHub Release with SHA-256 checksums.
#
# Signing is OPTIONAL and auto-enables: if the SIGNPATH_API_TOKEN secret is set,
# the release is code-signed via SignPath; if it is absent (e.g. before the
# SignPath Foundation approval arrives), the release ships the unsigned but
# verifiable build, clearly labelled as such on the Release page. This lets the
# project satisfy SignPath's "already released in the form to be signed"
# condition while approval is pending.
#
# SignPath's OSS conditions require that every job leading up to the signing
# request runs on a GitHub-hosted agent (windows-latest here) and that the
# artifact is uploaded with actions/upload-artifact v4+ so its origin is
# verifiable. Do not move the build to a self-hosted runner.
#
# Repository configuration to enable signing (Settings -> Secrets and variables):
#   secret  SIGNPATH_API_TOKEN        API token of a user with submitter rights
#   variable SIGNPATH_ORGANIZATION_ID  your SignPath organization GUID
#   variable SIGNPATH_PROJECT_SLUG     (optional) defaults to "league-link"
#   variable SIGNPATH_SIGNING_POLICY_SLUG (optional) defaults to "release-signing"
#   variable SIGNPATH_ARTIFACT_CONFIG_SLUG (optional) defaults to "windows-dll"

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  windows:
    name: Build, sign, release (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches crate versions
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $root = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $ffi  = (Select-String -Path ffi/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($tag -ne "v$root") { Write-Error "tag $tag != root version v$root"; exit 1 }
          if ($tag -ne "v$ffi")  { Write-Error "tag $tag != ffi version v$ffi"; exit 1 }
          Write-Host "Releasing $tag"

      - name: Test (workspace)
        run: cargo test --workspace --locked

      - name: Build release DLL
        run: cargo build --release --locked -p league-link-ffi

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/league_link.dll dist/
          Copy-Item ffi/league_link.h dist/
          Copy-Item LICENSE dist/LICENSE.txt

      - name: Upload unsigned artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: league-link-windows-x64
          path: dist/*
          if-no-files-found: error

      - name: Detect SignPath configuration
        id: signpath
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if ($env:SIGNPATH_API_TOKEN) {
            "enabled=true" >> $env:GITHUB_OUTPUT
            "note=Code-signed via SignPath.io, certificate by SignPath Foundation." >> $env:GITHUB_OUTPUT
            Write-Host "SignPath configured: this release will be signed."
          } else {
            "enabled=false" >> $env:GITHUB_OUTPUT
            "note=Unsigned verifiable build. Code signing is pending SignPath Foundation approval; this DLL was built by GitHub Actions from the source at this tag." >> $env:GITHUB_OUTPUT
            Write-Host "SignPath not configured: releasing unsigned verifiable build."
          }

      - name: Submit SignPath signing request
        if: steps.signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'league-link' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_SLUG || 'windows-dll' }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          # Manual approval can take a while; wait up to 4 hours.
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: release

      - name: Stage unsigned release (SignPath not configured)
        if: steps.signpath.outputs.enabled != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/* release/ -Recurse

      - name: Checksums of release files
        shell: pwsh
        run: |
          Get-ChildItem release -Recurse -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Append -Encoding ascii sha256sums.txt
          }
          Get-Content sha256sums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/**/*
            sha256sums.txt
          body: ${{ steps.signpath.outputs.note }}
          generate_release_notes: true
          fail_on_unmatched_files: true
